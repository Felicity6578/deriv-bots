<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0b0f19;color:#fff;font-family:sans-serif;padding:15px}h2{color:#1aff8c}</style></head><body><h2 id="s">CONNECTING...</h2><div>Price:<span id="p">-</span> Digit:<b id="d">-</b> Count:<span id="c">0</span></div><div id="l" style="opacity:.6;font-size:12px">log</div><script>let t=[],ws;function log(x){document.getElementById('l').innerText=x}function go(){ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=()=>{document.getElementById('s').innerText='● LIVE CONNECTED';log('open');ws.send(JSON.stringify({ticks:'R_100',subscribe:1}))};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.tick){let q=d.tick.quote.toString();let dig=parseInt(q.slice(-1));t.unshift(dig);document.getElementById('p').innerText=q;document.getElementById('d').innerText=dig;document.getElementById('c').innerText=t.length;log('ticks:'+t.length)}};ws.onclose=()=>{log('reconnect');setTimeout(go,2000)}}go();</script></body></html>
